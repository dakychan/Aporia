name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Compile
        run: |
          mkdir -p build
          find src -name "*.java" > sources.txt
          javac -d build -sourcepath src -cp "libs/*" --release 26 -encoding UTF-8 @sources.txt

      - name: Package JAR
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M)
          ARTIFACT="aporia_nightly_${DATE}.jar"
          jar cf "${ARTIFACT}" -C build .
          echo "ARTIFACT_NAME=${ARTIFACT}" >> $GITHUB_ENV
          echo "BUILD_DATE=${DATE}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ env.BUILD_DATE }}
          name: Nightly Build ${{ env.BUILD_DATE }}
          files: ${{ env.ARTIFACT_NAME }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
